[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infersight"
version = "0.1.0"
description = "The open-source intelligence layer for AI inference infrastructure"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
  {name = "piyushdaftary", email = "piyush@infersight.dev"},
]
keywords = ["llm", "inference", "observability", "mlops", "vllm", "sglang"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "fastapi==0.111.1",
  "uvicorn[standard]==0.29.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.14.1",
  "httpx>=0.28.0",
  "apscheduler==3.10.4",
  "litellm>=1.80.0",
  "structlog==24.2.0",
  "typer==0.12.3",
  "aiosqlite==0.20.0",
  "pyyaml==6.0.1",
  "python-hcl2==4.3.2",
  "prometheus-client==0.20.0",
  "python-multipart==0.0.9",
  "aiosmtplib>=3.0.0",
  "python-jose[cryptography]==3.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.4.10",
  "mypy==1.10.0",
  "pre-commit==3.7.1",
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "pytest-cov==5.0.0",
  "hypothesis==6.103.1",
  "types-pyyaml==6.0.12.20240311",
]
test = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "pytest-cov==5.0.0",
  "hypothesis==6.103.1",
]
docs = [
  "mkdocs==1.6.0",
  "mkdocs-material==9.5.27",
]

[project.scripts]
infersight = "infersight.cli:app"

[project.urls]
Homepage = "https://github.com/piyushdaftary/InferSight"
Repository = "https://github.com/piyushdaftary/InferSight"
Issues = "https://github.com/piyushdaftary/InferSight/issues"

[tool.hatch.build.targets.wheel]
packages = ["infersight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["infersight"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "aiosqlite.*",
  "litellm.*",
  "hcl2.*",
  "prometheus_client.*",
  "jose.*",
  "tomli.*",
  "aiosmtplib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=infersight --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["infersight"]
omit = ["tests/*"]
